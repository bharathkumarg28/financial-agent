<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Financial Agent India</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@0.562.0/dist/font/lucide.css">
    <style>
        :root { 
            --bs-body-bg: #1a1d21; 
            --bs-body-color: #e9ecef; 
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        body { 
            background: linear-gradient(135deg, #1a1d21 0%, #2d3436 100%); 
            min-height: 100vh; 
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-container { max-width: 450px; width: 100%; }
        .card { 
            background: rgba(255,255,255,0.08); 
            border: 1px solid rgba(255,255,255,0.15); 
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border-radius: 20px;
            overflow: hidden;
        }
        .card-header { 
            background: var(--primary-gradient); 
            border-bottom: none; 
            padding: 2rem 1.5rem;
            text-align: center;
        }
        .card-body { padding: 2rem 1.5rem; }
        .form-control, .form-select { 
            background: rgba(255,255,255,0.1); 
            border: 1px solid rgba(255,255,255,0.2); 
            color: #e9ecef; 
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 15px;
            transition: all 0.3s ease;
        }
        .form-control:focus, .form-select:focus { 
            background: rgba(255,255,255,0.15); 
            border-color: #667eea; 
            color: #e9ecef; 
            box-shadow: 0 0 0 0.25rem rgba(102, 126, 234, 0.25); 
            transform: translateY(-1px);
        }
        .form-label { 
            color: #e9ecef; 
            font-weight: 500; 
            margin-bottom: 8px;
            font-size: 14px;
        }
        .form-text { color: #adb5bd; font-size: 13px; }
        .btn-primary { 
            background: var(--primary-gradient); 
            border: none; 
            transition: all 0.3s ease;
            border-radius: 10px;
            padding: 12px 24px;
            font-weight: 600;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        .btn-primary:hover { 
            background: var(--secondary-gradient); 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(240, 147, 251, 0.4);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        .alert { 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            font-size: 14px;
        }
        .brand-logo { 
            width: 70px; 
            height: 70px; 
            background: rgba(255,255,255,0.2); 
            border-radius: 20px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0 auto 1rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .brand-logo i { color: white; font-size: 28px; }
        .input-group { border-radius: 10px; overflow: hidden; }
        .input-group-text { 
            background: rgba(255,255,255,0.1); 
            border: 1px solid rgba(255,255,255,0.2); 
            color: #adb5bd; 
            border-right: none;
        }
        .password-toggle { cursor: pointer; color: #adb5bd; }
        .password-toggle:hover { color: #e9ecef; }
        .loading-overlay { 
            position: absolute; 
            top: 0; 
            left: 0; 
            right: 0; 
            bottom: 0; 
            background: rgba(0,0,0,0.8); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 0.375rem; 
            z-index: 1000;
        }
        .text-primary { color: #667eea !important; }
        .text-primary:hover { color: #764ba2 !important; }
        .form-check-input:checked { 
            background-color: #667eea; 
            border-color: #667eea;
        }
        .text-muted { color: #adb5bd !important; }
        h3 { color: white; font-weight: 600; }
    </style>
</head>
<body>
<div class="login-container">
    <div class="card">
        <div class="card-header text-center">
            <div class="brand-logo">
                <i data-lucide="trending-up"></i>
            </div>
            <h3 class="mb-2">Financial Agent India</h3>
            <p class="text-muted mb-0">Sign in to your account</p>
        </div>
        <div class="card-body">
            <!-- Alert Messages -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i data-lucide="alert-circle" class="me-2"></i>
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i data-lucide="check-circle" class="me-2"></i>
                <span th:text="${message}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- JavaScript Error Messages -->
            <div id="jsErrorAlert" class="alert alert-danger alert-dismissible fade show d-none" role="alert">
                <i data-lucide="alert-circle" class="me-2"></i>
                <span id="jsErrorMessage"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Username or Email</label>
                    <div class="input-group">
                            <span class="input-group-text">
                                <i data-lucide="user"></i>
                            </span>
                        <input type="text" class="form-control" id="username" name="username"
                               placeholder="Enter your username or email" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                            <span class="input-group-text">
                                <i data-lucide="lock"></i>
                            </span>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="Enter your password" required>
                        <button type="button" class="btn btn-outline-secondary password-toggle" id="togglePassword">
                            <i data-lucide="eye-off"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-3 d-flex justify-content-between align-items-center">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe" name="remember-me">
                        <label class="form-check-label" for="rememberMe">
                            Remember me
                        </label>
                    </div>
                    <a href="/forgot-password" class="text-primary text-decoration-none">
                        Forgot password?
                    </a>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg" id="loginBtn">
                        <span id="loginBtnText">Sign In</span>
                        <span id="loginSpinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
                    </button>
                </div>
            </form>

            <div class="text-center mt-4">
                <p class="text-muted mb-2">
                    Don't have an account?
                    <a href="/register" class="text-primary text-decoration-none fw-bold">Create Account</a>
                </p>
                <p class="text-muted mb-0">
                    <a href="/forgot-password" class="text-primary text-decoration-none">Forgot Password?</a>
                </p>
            </div>

            <!-- Demo Account Info -->
            <div class="alert alert-info mt-4">
                <h6 class="alert-heading"><i data-lucide="info" class="me-2"></i>Demo Account</h6>
                <p class="mb-2">For testing purposes, you can create a new account or contact admin for demo
                    credentials.</p>
                <small class="text-muted">
                    <strong>Note:</strong> All AngelOne credentials are encrypted and stored securely.
                </small>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide-static@0.562.0/dist/umd/lucide.js"></script>

<script>
    // Initialize Lucide icons
    lucide.createIcons();

    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const loginBtnText = document.getElementById('loginBtnText');
        const loginSpinner = document.getElementById('loginSpinner');
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const usernameInput = document.getElementById('username');

        // Password visibility toggle
        togglePassword.addEventListener('click', function() {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;

            const icon = this.querySelector('i');
            icon.setAttribute('data-lucide', type === 'password' ? 'eye-off' : 'eye');
            lucide.createIcons();
        });

        // Form submission
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            if (!validateForm()) {
                return;
            }

            // Show loading state
            loginBtn.disabled = true;
            loginBtnText.textContent = 'Signing In...';
            loginSpinner.classList.remove('d-none');

            try {
                const formData = new FormData(form);
                const data = new URLSearchParams(formData);

                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: data
                });

                const result = await response.json();

                if (result.success) {
                    showToast('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                } else {
                    showToast(result.error || 'Login failed', 'danger');
                }
            } catch (error) {
                // Fallback to traditional form submission if API fails
                console.log('API login failed, using traditional form submission');
                form.submit();
            } finally {
                // Reset button state
                loginBtn.disabled = false;
                loginBtnText.textContent = 'Sign In';
                loginSpinner.classList.add('d-none');
            }
        });

        function validateForm() {
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if (!username) {
                showJSError('Please enter your username or email');
                usernameInput.focus();
                return false;
            }

            if (!password) {
                showJSError('Please enter your password');
                passwordInput.focus();
                return false;
            }

            if (password.length < 6) {
                showJSError('Password must be at least 6 characters');
                passwordInput.focus();
                return false;
            }

            return true;
        }

        function showJSError(message) {
            const errorAlert = document.getElementById('jsErrorAlert');
            const errorMessage = document.getElementById('jsErrorMessage');
            
            errorMessage.textContent = message;
            errorAlert.classList.remove('d-none');
            
            // Scroll to top to show error
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            // Auto-hide after 5 seconds
            setTimeout(() => {
                errorAlert.classList.add('d-none');
            }, 5000);
        }

        // Auto-focus username field
        usernameInput.focus();

        // Handle Enter key in form fields
        usernameInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                passwordInput.focus();
            }
        });

        passwordInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                form.dispatchEvent(new Event('submit'));
            }
        });

        // Check for error messages and focus appropriate field
        const errorAlert = document.querySelector('.alert-danger');
        if (errorAlert) {
            const errorText = errorAlert.textContent.toLowerCase();
            if (errorText.includes('username') || errorText.includes('email')) {
                usernameInput.focus();
            } else if (errorText.includes('password')) {
                passwordInput.focus();
            }
        }
    });

    function showToast(message, type = 'info') {
        const toastContainer = document.getElementById('toastContainer') || createToastContainer();

        const toast = document.createElement('div');
        toast.className = `toast align-items-center text-white bg-${type} border-0`;
        toast.setAttribute('role', 'alert');
        toast.setAttribute('aria-live', 'assertive');
        toast.setAttribute('aria-atomic', 'true');

        toast.innerHTML = `
            <div class="d-flex">
                <div class="toast-body">
                    ${message}
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        `;

        toastContainer.appendChild(toast);

        const bsToast = new bootstrap.Toast(toast, {
            autohide: true,
            delay: 3000
        });

        bsToast.show();

        toast.addEventListener('hidden.bs.toast', () => {
            toast.remove();
        });
    }

    function createToastContainer() {
        const container = document.createElement('div');
        container.id = 'toastContainer';
        container.className = 'toast-container position-fixed top-0 end-0 p-3';
        container.style.zIndex = '1050';
        document.body.appendChild(container);
        return container;
    }
</script>
</body>
</html>
