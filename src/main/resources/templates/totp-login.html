<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOTP Login - Financial Agent India</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bs-body-bg: #1a1d21; --bs-body-color: #e9ecef; }
        body { background: linear-gradient(135deg, #1a1d21 0%, #2d3436 100%); min-height: 100vh; }
        .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }
        .card-header { background: rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .form-control, .form-select { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #e9ecef; }
        .form-control:focus, .form-select:focus { background: rgba(255,255,255,0.15); border-color: #0d6efd; color: #e9ecef; box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25); }
        .form-text { color: #adb5bd; }
        .btn-primary { background: linear-gradient(45deg, #0d6efd, #0056b3); border: none; }
        .btn-primary:hover { background: linear-gradient(45deg, #0056b3, #004085); }
        .invalid-feedback { color: #ff6b6b; }
    </style>
</head>
<body class="d-flex flex-column">
<div class="container py-5 flex-grow-1 d-flex align-items-center justify-content-center">
    <div class="row justify-content-center w-100">
        <div class="col-lg-6 col-md-8">
            <div class="card">
                <div class="card-header">
                    <h3 class="mb-0 text-center text-white">AngelOne TOTP Login</h3>
                    <p class="text-center mb-0" style="color: #e9ecef; font-size: 14px;">
                        Session-based authentication (no database storage)
                    </p>
                </div>
                <div class="card-body">
                    <div class="alert alert-info">
                        <small>
                            <strong>Note:</strong> Your credentials are used only for this session and are not stored in the database.
                            You will need to re-enter them for each new session.
                        </small>
                    </div>
                    <form id="totpLoginForm">
                        <div class="mb-3">
                            <label for="clientId" class="form-label">Client ID *</label>
                            <input type="text" class="form-control" id="clientId" placeholder="Your AngelOne Client ID" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password *</label>
                            <input type="password" class="form-control" id="password" placeholder="Your AngelOne PIN" required>
                        </div>
                        <div class="mb-3">
                            <label for="apiKey" class="form-label">API Key *</label>
                            <input type="text" class="form-control" id="apiKey" placeholder="Your AngelOne API Key" required>
                        </div>
                        <div class="mb-3">
                            <label for="totp" class="form-label">TOTP Code *</label>
                            <input type="text" class="form-control" id="totp" placeholder="6-digit TOTP code" maxlength="6" required>
                            <div class="form-text">Enter the 6-digit code from your authenticator app</div>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg" id="loginBtn">
                                <span id="loginBtnText">Connect to AngelOne</span>
                                <span id="loginSpinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
                            </button>
                            <a href="/" class="btn btn-outline-secondary">Back to Dashboard</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('totpLoginForm');
        const loginBtn = document.getElementById('loginBtn');
        const loginBtnText = document.getElementById('loginBtnText');
        const loginSpinner = document.getElementById('loginSpinner');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            // Show loading state
            loginBtn.disabled = true;
            loginBtnText.textContent = 'Connecting...';
            loginSpinner.classList.remove('d-none');

            try {
                const response = await fetch('/api/totp-login/authenticate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: new URLSearchParams({
                        clientId: document.getElementById('clientId').value,
                        password: document.getElementById('password').value,
                        apiKey: document.getElementById('apiKey').value,
                        totp: document.getElementById('totp').value
                    })
                });

                const result = await response.json();

                if (result.success) {
                    showToast('Authentication successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1500);
                } else {
                    showToast(result.error || 'Authentication failed', 'danger');
                }
            } catch (error) {
                showToast('An error occurred. Please try again.', 'danger');
                console.error('Login error:', error);
            } finally {
                // Reset button state
                loginBtn.disabled = false;
                loginBtnText.textContent = 'Connect to AngelOne';
                loginSpinner.classList.add('d-none');
            }
        });

        function showToast(message, type) {
            const toastContainer = document.createElement('div');
            toastContainer.style.position = 'fixed';
            toastContainer.style.top = '20px';
            toastContainer.style.right = '20px';
            toastContainer.style.zIndex = '1050';

            const toast = document.createElement('div');
            toast.className = `toast show`;
            toast.style.minWidth = '300px';

            const toastBody = document.createElement('div');
            toastBody.className = `toast-body text-white bg-${type}`;
            toastBody.textContent = message;

            toast.appendChild(toastBody);
            toastContainer.appendChild(toast);
            document.body.appendChild(toastContainer);

            setTimeout(() => {
                toastContainer.remove();
            }, 3000);
        }
    });
</script>
</body>
</html>
